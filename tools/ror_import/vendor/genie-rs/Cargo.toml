[workspace]
members = [
    "crates/genie-cpx",
    "crates/genie-scx",
    "crates/genie-support",
]

[workspace.package]
authors = ["Renée Kooi <renee@kooi.me>"]
edition = "2021"
rust-version = "1.64.0"
license = "GPL-3.0"
repository = "https://github.com/SiegeEngineers/genie-rs"

[workspace.dependencies]
structopt = "0.3.26"
anyhow = "1.0.65"
simplelog = "0.12.0"
thiserror = "1.0.36"
byteorder = "1.4.3"
flate2 = { version = "1.0.24", features = [
  "rust_backend",
], default-features = false }
encoding_rs = "0.8.31"
encoding_rs_io = "0.1.7"
rgb = "0.8.34"
num_enum = "0.5.7"
arrayvec = "0.7.2"
